<!DOCTYPE html>
<html>
<head>
<title>Customer Churn Prediction</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

<h1>Customer Churn Prediction System</h1>

<form action="/predict" method="post">

<input type="number" name="tenure" placeholder="Tenure">

<input type="number" step="0.01" name="monthly" placeholder="Monthly Charges">

<input type="number" step="0.01" name="total" placeholder="Total Charges">

<select name="contract">
<option value="0">Month-to-Month</option>
<option value="1">One Year</option>
<option value="2">Two Year</option>
</select>

<select name="internet">
<option value="0">DSL</option>
<option value="1">Fiber</option>
<option value="2">No Internet</option>
</select>

<button type="submit">
Predict
</button>

</form>

</div>

</body>
</html>
